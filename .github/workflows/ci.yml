name: CI

# O deploy vive AQUI, e não num `deploy.yml` separado, por um motivo que custou um
# incidente em 30/jul/2026 no `farol`: dois workflows no mesmo `push` disparam em
# PARALELO, e `needs:` só existe entre jobs do MESMO arquivo. Com os arquivos
# separados, código com o lint reprovado subia para produção — o CI vermelho não
# segurava nada. Juntar os dois é o que torna o portão estrutural em vez de
# decorativo. Unificado nos quatro repos irmãos em 03/ago/2026.
#
# A alternativa examinada e recusada foi `workflow_run` mantendo os dois arquivos:
# exige `ref: head_sha` explícito no checkout, lê a definição sempre do branch
# default e depende de checar `conclusion == 'success'` à mão. Três lugares para
# errar em silêncio contra um `needs:` que o próprio Actions garante.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test

  # Testes de integração de RLS: sobe a stack local do Supabase (a migration
  # 20260628151355 é o espelho da produção + supabase/seed.sql) e prova o que
  # cada papel — anon, respondente, pesquisador, admin — consegue ler/escrever.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: pnpm run test:rls
        env:
          REQUIRE_RLS_STACK: "1"

  deploy:
    # O portão. Sem isto, o job roda em paralelo com os testes.
    needs: [lint-and-test, rls]
    # `pull_request` também dispara este workflow, e PR não faz deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vite + Nitro (cloudflare-module) gera o Worker em dist/ e o config de
      # deploy em .wrangler/deploy/config.json (lido automaticamente pelo wrangler).
      # As VITE_ são chaves públicas (anon) — mesmas de wrangler.jsonc/.env.example —
      # injetadas no bundle client em build-time. Secrets reais ficam no Worker.
      - name: Build (Vite + Nitro cloudflare-module)
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://nuolncddavudliabqsdx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51b2xuY2RkYXZ1ZGxpYWJxc2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2MjQ0NzAsImV4cCI6MjA5ODIwMDQ3MH0.7CfYS1I8tVhw8QVQqjblROrxM8jpO3kor5MudX4pyS4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "latest"
          command: deploy
